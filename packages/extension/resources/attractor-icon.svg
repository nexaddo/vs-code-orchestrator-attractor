<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="32" fill="#1a1a2e"/>
  <defs>
    <linearGradient id="grad-l" x1="0%" y1="20%" x2="60%" y2="80%">
      <stop offset="0%" stop-color="#00ffa3"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="grad-r" x1="100%" y1="20%" x2="40%" y2="80%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <linearGradient id="grad-tail" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e8c0"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Glow filter for neon effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(128, 118)" filter="url(#glow)">
    <!--
      Lorenz butterfly: 2 large lobes + crossing center + descending tail.
      Each lobe is a single closed bezier tracing the outer envelope.
      The lobes overlap at the center crossing point to create the
      characteristic figure-8 topology.
    -->
    <!-- Left lobe: outer envelope, bold -->
    <path d="M0,4 C-16,-30 -80,-76 -84,-42
             C-88,-8 -48,30 -24,36
             C-8,40 -2,16 0,4Z"
          fill="none" stroke="url(#grad-l)" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right lobe: outer envelope, bold -->
    <path d="M0,4 C16,-30 80,-76 84,-42
             C88,-8 48,30 24,36
             C8,40 2,16 0,4Z"
          fill="none" stroke="url(#grad-r)" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Second orbit — left, medium weight for layered depth -->
    <path d="M0,0 C-14,-24 -66,-66 -72,-38
             C-78,-10 -44,22 -22,28
             C-6,32 -1,10 0,0Z"
          fill="none" stroke="url(#grad-l)" stroke-width="4.5"
          stroke-opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Second orbit — right, medium weight for layered depth -->
    <path d="M0,0 C14,-24 66,-66 72,-38
             C78,-10 44,22 22,28
             C6,32 1,10 0,0Z"
          fill="none" stroke="url(#grad-r)" stroke-width="4.5"
          stroke-opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Third orbit — left, ghost trail -->
    <path d="M0,-2 C-10,-18 -52,-52 -58,-30
             C-64,-8 -38,14 -18,20
             C-4,24 -1,6 0,-2Z"
          fill="none" stroke="url(#grad-l)" stroke-width="2.5"
          stroke-opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Third orbit — right, ghost trail -->
    <path d="M0,-2 C10,-18 52,-52 58,-30
             C64,-8 38,14 18,20
             C4,24 1,6 0,-2Z"
          fill="none" stroke="url(#grad-r)" stroke-width="2.5"
          stroke-opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Descending tail from center — brighter, bolder -->
    <path d="M0,4 C-10,22 -14,50 0,66 C14,50 10,22 0,4Z"
          fill="none" stroke="url(#grad-tail)" stroke-width="5.5"
          stroke-opacity="0.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
